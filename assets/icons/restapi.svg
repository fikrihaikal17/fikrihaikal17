<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <!-- Card Background -->
  <rect width="256" height="256" rx="60" fill="#242938"/>

  <!-- High-Visibility Traveling Laser Border Tracing -->
  <rect x="4" y="4" width="248" height="248" rx="56" fill="none" stroke="#00E5FF" stroke-width="8" stroke-dasharray="160 300">
    <animate attributeName="stroke-dashoffset" from="0" to="920" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Ambient Glow Corner Highlights -->
  <circle cx="28" cy="28" r="18" fill="#00E5FF" opacity="0.18">
    <animate attributeName="opacity" values="0.18; 0.55; 0.18" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="228" cy="228" r="18" fill="#00E5FF" opacity="0.18">
    <animate attributeName="opacity" values="0.18; 0.55; 0.18" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Centered Logo with Uniform Levitation & Breathing Animation -->
  <g transform="translate(0, 0)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0; 0,10; 0,0" dur="3.2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1 1; 1.05 1.05; 1 1; 0.98 0.98; 1 1" transform-origin="128 128" additive="sum" dur="3.2s" repeatCount="indefinite"/>
    
    <g transform="translate(53, 53) scale(1)">
      
        <rect x="0" y="0" width="150" height="150" rx="28" fill="#132F38"/>
        <text x="75" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="900" font-size="34" fill="#00E5FF">{REST}</text>
        <text x="75" y="108" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="800" font-size="24" fill="#80DEEA" letter-spacing="5">API</text>
      
    </g>
  </g>
</svg>
