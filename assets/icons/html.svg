<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    
      <linearGradient id="shimmer-grad-html" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FFA000" stop-opacity="0"/>
        <stop offset="50%" stop-color="#FFF" stop-opacity="0.85"/>
        <stop offset="100%" stop-color="#E44D26" stop-opacity="0"/>
      </linearGradient>
      <clipPath id="card-clip-html">
        <rect width="256" height="256" rx="60"/>
      </clipPath>
    
    <filter id="glow-html" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="256" height="256" rx="60" fill="#242938"/>

  <!-- High-Visibility Laser Border Tracing -->
  <rect x="4" y="4" width="248" height="248" rx="56" fill="none" stroke="#E44D26" stroke-width="8" stroke-dasharray="160 300">
    <animate attributeName="stroke-dashoffset" from="0" to="920" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Ambient Glow Corner Highlights -->
  <circle cx="28" cy="28" r="18" fill="#E44D26" opacity="0.15">
    <animate attributeName="opacity" values="0.15; 0.45; 0.15" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="228" cy="228" r="18" fill="#E44D26" opacity="0.15">
    <animate attributeName="opacity" values="0.15; 0.45; 0.15" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Technology Logo with Signature Animation -->
  <g id="logo-html">
    
      <animateTransform attributeName="transform" type="scale" values="1 1; 1.08 1.08; 1 1; 1.03 1.03; 1 1" transform-origin="128 128" dur="2.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0; 0,8; 0,0" additive="sum" dur="2.5s" repeatCount="indefinite"/>
    
    </clipPath>
    
    <filter id="glow-html" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="256" height="256" rx="60" fill="#242938"/>

  <!-- High-Visibility Laser Border Tracing -->
  <rect x="4" y="4" width="248" height="248" rx="56" fill="none" stroke="#E44D26" stroke-width="8" stroke-dasharray="160 300">
    <animate attributeName="stroke-dashoffset" from="0" to="920" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Ambient Glow Corner Highlights -->
  <circle cx="28" cy="28" r="18" fill="#E44D26" opacity="0.15">
    <animate attributeName="opacity" values="0.15; 0.45; 0.15" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="228" cy="228" r="18" fill="#E44D26" opacity="0.15">
    <animate attributeName="opacity" values="0.15; 0.45; 0.15" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Technology Logo with Signature Animation -->
  <g id="logo-html">
    
      <animateTransform attributeName="transform" type="scale" values="1 1; 1.08 1.08; 1 1; 1.03 1.03; 1 1" transform-origin="128 128" dur="2.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0; 0,8; 0,0" additive="sum" dur="2.5s" repeatCount="indefinite"/>
    
    <path fill="#fff" d="M48 38L56.6098 134.593H167.32L163.605 176.023L127.959 185.661L92.38 176.037L90.0012 149.435H57.9389L62.5236 200.716L127.951 218.888L193.461 200.716L202.244 102.655H85.8241L82.901 69.9448H205.041H205.139L208 38H48Z"/><path fill="#EBEBEB" d="M128 38H48L56.6098 134.593H128V102.655H85.8241L82.901 69.9448H128V38Z"/><path fill="#EBEBEB" d="M128 185.647L127.959 185.661L92.38 176.037L90.0012 149.435H57.9388L62.5236 200.716L127.951 218.888L128 218.874V185.647Z"/>
  </g>

  <!-- Unique Particle / Element Effects -->
  
      <!-- HTML Solar glow sweep -->
      <g clip-path="url(#card-clip-html)">
        <polygon points="0,0 60,0 140,256 80,256" fill="url(#shimmer-grad-html)" opacity="0.5">
          <animateTransform attributeName="transform" type="translate" values="-180,0; 320,0" dur="2.6s" repeatCount="indefinite"/>
        </polygon>
      </g>
  </g>

  <!-- Unique Particle / Element Effects -->
  
