<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <!-- Card Background -->
  <rect width="256" height="256" rx="60" fill="#242938"/>

  <!-- High-Visibility Traveling Laser Border Tracing -->
  <rect x="4" y="4" width="248" height="248" rx="56" fill="none" stroke="#E34F26" stroke-width="8" stroke-dasharray="160 300">
    <animate attributeName="stroke-dashoffset" from="0" to="920" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Ambient Glow Corner Highlights -->
  <circle cx="28" cy="28" r="18" fill="#E34F26" opacity="0.18">
    <animate attributeName="opacity" values="0.18; 0.55; 0.18" dur="2.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="228" cy="228" r="18" fill="#E34F26" opacity="0.18">
    <animate attributeName="opacity" values="0.18; 0.55; 0.18" dur="2.9s" repeatCount="indefinite"/>
  </circle>

  <!-- Centered Logo with Uniform Levitation & Breathing Animation -->
  <g transform="translate(0, 0)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0; 0,10; 0,0" dur="2.9s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1 1; 1.05 1.05; 1 1; 0.98 0.98; 1 1" transform-origin="128 128" additive="sum" dur="2.9s" repeatCount="indefinite"/>
    
    <g transform="translate(53, 53) scale(1.1719)">
      <path fill="#E44D26" d="M19.037 113.876L9.032 1.661h109.936l-10.016 112.198-45.019 12.48z"/><path fill="#F16529" d="M64 116.8l36.378-10.086 8.559-95.878H64z"/><path fill="#EBEBEB" d="M64 52.455H45.788L44.53 38.361H64V24.599H29.489l.33 3.692 3.382 37.927H64zm0 35.743l-.061.017-15.327-4.14-.979-10.975H33.816l1.928 21.609 28.193 7.826.063-.017z"/><path fill="#fff" d="M63.952 52.455v13.763h16.947l-1.597 17.849-15.35 4.143v14.319l28.215-7.82.207-2.325 3.234-36.233.335-3.696h-3.708zm0-27.856v13.762h33.244l.276-3.092.628-6.978.329-3.692z"/>
    </g>
  </g>
</svg>
