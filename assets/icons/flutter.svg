<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    
    <filter id="glow-flutter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="256" height="256" rx="60" fill="#242938"/>

  <!-- High-Visibility Laser Border Tracing -->
  <rect x="4" y="4" width="248" height="248" rx="56" fill="none" stroke="#44D1FD" stroke-width="8" stroke-dasharray="160 300">
    <animate attributeName="stroke-dashoffset" from="0" to="920" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Ambient Glow Corner Highlights -->
  <circle cx="28" cy="28" r="18" fill="#44D1FD" opacity="0.15">
    <animate attributeName="opacity" values="0.15; 0.45; 0.15" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="228" cy="228" r="18" fill="#44D1FD" opacity="0.15">
    <animate attributeName="opacity" values="0.15; 0.45; 0.15" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Technology Logo with Signature Animation -->
  <g id="logo-flutter">
    
      <animateTransform attributeName="transform" type="translate" values="0,0; -12,-14; 0,0; 12,8; 0,0" dur="2.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 128 128; -5 128 128; 0 128 128; 5 128 128; 0 128 128" additive="sum" dur="2.8s" repeatCount="indefinite"/>
    
    <!-- High-Visibility Laser Border Tracing -->
  <rect x="4" y="4" width="248" height="248" rx="56" fill="none" stroke="#44D1FD" stroke-width="8" stroke-dasharray="160 300">
