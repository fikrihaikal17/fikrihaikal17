<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <!-- Card Background -->
  <rect width="256" height="256" rx="60" fill="#242938"/>

  <!-- High-Visibility Traveling Laser Border Tracing -->
  <rect x="4" y="4" width="248" height="248" rx="56" fill="none" stroke="#1572B6" stroke-width="8" stroke-dasharray="160 300">
    <animate attributeName="stroke-dashoffset" from="0" to="920" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Ambient Glow Corner Highlights -->
  <circle cx="28" cy="28" r="18" fill="#1572B6" opacity="0.18">
    <animate attributeName="opacity" values="0.18; 0.55; 0.18" dur="3.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="228" cy="228" r="18" fill="#1572B6" opacity="0.18">
    <animate attributeName="opacity" values="0.18; 0.55; 0.18" dur="3.0s" repeatCount="indefinite"/>
  </circle>

  <!-- Centered Logo with Uniform Levitation & Breathing Animation -->
  <g transform="translate(0, 0)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0; 0,10; 0,0" dur="3.0s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1 1; 1.05 1.05; 1 1; 0.98 0.98; 1 1" transform-origin="128 128" additive="sum" dur="3.0s" repeatCount="indefinite"/>
    
    <g transform="translate(53, 53) scale(1.1719)">
      <path fill="#1572B6" d="M18.814 114.123L8.76 1.352h110.48l-10.064 112.754-45.243 12.543-45.119-12.526z"/><path fill="#33A9DC" d="M64.001 117.062l36.559-10.136 8.601-96.354h-45.16v106.49z"/><path fill="#fff" d="M64.001 51.429h18.302l1.264-14.163H64.001V23.435h34.682l-.332 3.711-3.4 38.114h-30.95V51.429z"/><path fill="#EBEBEB" d="M64.083 87.349l-.061.018-15.403-4.159-.985-11.031H33.752l1.937 21.717 28.331 7.863.063-.018v-14.39z"/><path fill="#fff" d="M81.127 64.675l-1.666 18.522-15.426 4.164v14.39l28.354-7.858.208-2.337 2.406-26.881H81.127z"/><path fill="#EBEBEB" d="M64.048 23.435v13.831H30.64l-.277-3.108-.63-7.012-.331-3.711h34.646zm-.047 27.996v13.831H48.792l-.277-3.108-.631-7.012-.33-3.711h16.447z"/>
    </g>
  </g>
</svg>
